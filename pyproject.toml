[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simulatics"
version = "0.2.0"
description = "Humanoid robot workbench: MuJoCo physics, model-based walking, arms and hands, sensors, planning, CAD and topology optimisation, AI design search, PPO and evolution training, Claude-piloted missions"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "scipy>=1.11",          # ZMP preview gains (Riccati), Bayesian optimisation, sparse FEA fallback
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10",
    "manifold3d>=3.0",      # CSG for CAD parts
    "trimesh>=4.0",         # meshes, mass properties, export
    "scikit-image>=0.22",   # marching cubes for topology-optimised parts
    "threadpoolctl>=3.1",   # BLAS thread limits during PPO
    "websockets>=15",       # ROS 2 bridge (rosbridge v2 client) and live GUI stream
    "anthropic>=2.0",       # Claude pilot (only imported when a Claude mission runs)
]

[project.optional-dependencies]
step = ["build123d>=0.9"]   # STEP export of CAD parts (OpenCASCADE, ~300 MB)
dev = ["pytest"]

[project.scripts]
simulatics = "simulatics.__main__:main"

[tool.setuptools.packages.find]
include = ["simulatics*"]

[tool.setuptools.package-data]
simulatics = ["server/static/*", "native/src/*", "native/CMakeLists.txt", "imitate/motions/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
