[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulatics"
version = "0.1.0"
description = "Humanoid robot simulation workbench: MuJoCo physics, sensors, planning, parallel evolutionary training"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
simulatics = "simulatics.__main__:main"

[tool.setuptools.packages.find]
include = ["simulatics*"]

[tool.setuptools.package-data]
simulatics = ["server/static/*", "native/src/*", "native/CMakeLists.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
