# Builds SimulaticsStudio.exe on Windows and attaches it to a GitHub release.
# Runs when a tag like v0.4.0 is pushed, or by hand from the Actions tab.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[studio]" pyinstaller
      - name: Native kernels (C++)
        run: python -m simulatics build-native
        continue-on-error: true      # the app falls back to Python when these are missing
      - name: Build exe
        run: python -m PyInstaller packaging/simulatics_studio.spec --noconfirm
      - name: Smoke test
        run: python -c "import os; s = os.path.getsize('dist/SimulaticsStudio.exe'); print(s); assert s > 50e6"
      - uses: actions/upload-artifact@v4
        with:
          name: SimulaticsStudio-windows
          path: dist/SimulaticsStudio.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/SimulaticsStudio.exe --title "Simulatics ${{ github.ref_name }}" --generate-notes
